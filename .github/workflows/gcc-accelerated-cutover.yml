name: GCC Accelerated Cutover

on:
  workflow_dispatch:
    inputs:
      skip_rls:
        description: "Skip Supabase RLS apply (if already applied)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      skip_azure_deploy:
        description: "Skip Azure Container App deploy trigger"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  id-token: write
  contents: read
  actions: write

concurrency:
  group: gcc-accelerated-cutover
  cancel-in-progress: false

jobs:
  stage1-rls:
    if: inputs.skip_rls != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci

      - name: Report secret presence (names only)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        run: |
          set -euo pipefail
          missing=()
          for key in NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY SUPABASE_SERVICE_ROLE_KEY; do
            if [ -z "${!key:-}" ]; then missing+=("$key"); else echo "PRESENT: $key"; fi
          done
          [ -n "${SUPABASE_ACCESS_TOKEN:-}" ] && echo "PRESENT: SUPABASE_ACCESS_TOKEN" || echo "ABSENT: SUPABASE_ACCESS_TOKEN"
          [ -n "${SUPABASE_DB_PASSWORD:-}${SUPABASE_DATABASE_URL:-}" ] && echo "PRESENT: DB credentials" || echo "ABSENT: DB credentials"
          if [ "${#missing[@]}" -gt 0 ]; then echo "MISSING_REQUIRED_SECRETS=${missing[*]}" >&2; exit 1; fi

      - name: Apply RLS (Management API)
        id: rls_api
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
        run: node scripts/apply-supabase-rls-via-api.mjs
        continue-on-error: true

      - name: Apply RLS (direct Postgres fallback)
        if: steps.rls_api.outcome != 'success'
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
        run: node scripts/run-supabase-sql.mjs rls

      - name: Verify RLS SQL
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
        run: |
          set -euo pipefail
          if [ -n "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            node scripts/apply-supabase-rls-via-api.mjs --verify-only
          else
            node scripts/run-supabase-sql.mjs verify-rls
          fi

      - name: RLS security tests
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run test:rls

      - name: Security incident review
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/security-incident-review.mjs

  stage2-trigger-azure:
    needs: stage1-rls
    if: |
      always() &&
      (needs.stage1-rls.result == 'success' || needs.stage1-rls.result == 'skipped') &&
      inputs.skip_azure_deploy != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Azure Production Deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run "Azure Production Deploy" --ref main --repo "${{ github.repository }}"
          echo "Azure Production Deploy triggered. Monitor Actions tab for deploy + pre-cutover-uat jobs."
