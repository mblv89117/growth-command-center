name: Azure Production Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: azure-production-deploy
  cancel-in-progress: false

env:
  AZURE_RESOURCE_GROUP: rg-gcc-prod
  AZURE_LOCATION: eastus
  IMAGE_NAME: gcc-web

jobs:
  stage1-rls:
    runs-on: ubuntu-latest
    if: github.repository == 'mblv89117/growth-command-center'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Report secret presence (names only)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        run: |
          set -euo pipefail
          missing=()
          for key in NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY SUPABASE_SERVICE_ROLE_KEY; do
            if [ -z "${!key:-}" ]; then
              missing+=("$key")
            else
              echo "PRESENT: $key"
            fi
          done
          if [ -n "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "PRESENT: SUPABASE_ACCESS_TOKEN"
          else
            echo "ABSENT: SUPABASE_ACCESS_TOKEN (DB fallback may still work)"
          fi
          if [ -n "${SUPABASE_DB_PASSWORD:-}${SUPABASE_DATABASE_URL:-}" ]; then
            echo "PRESENT: SUPABASE_DB_PASSWORD or SUPABASE_DATABASE_URL"
          else
            echo "ABSENT: SUPABASE_DB_PASSWORD / SUPABASE_DATABASE_URL"
          fi
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "MISSING_REQUIRED_SECRETS=${missing[*]}" >&2
            exit 1
          fi

      - name: Apply RLS (Management API)
        id: rls_api
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
        run: node scripts/apply-supabase-rls-via-api.mjs
        continue-on-error: true

      - name: Apply RLS (direct Postgres fallback)
        if: steps.rls_api.outcome != 'success'
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
        run: node scripts/run-supabase-sql.mjs rls

      - name: Verify RLS SQL
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
        run: |
          set -euo pipefail
          if [ -n "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            node scripts/apply-supabase-rls-via-api.mjs --verify-only
          else
            node scripts/run-supabase-sql.mjs verify-rls
          fi

      - name: RLS security tests
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run test:rls

      - name: Security incident review
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/security-incident-review.mjs

  deploy:
    needs: stage1-rls
    runs-on: ubuntu-latest
    if: github.repository == 'mblv89117/growth-command-center'
    outputs:
      acr_name: ${{ steps.infra.outputs.acr_name }}
      app_name: ${{ steps.infra.outputs.app_name }}
      fqdn: ${{ steps.infra.outputs.fqdn }}
      azure_url: ${{ steps.infra.outputs.azure_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Register Azure resource providers
        run: |
          set -euo pipefail
          for ns in \
            Microsoft.App \
            Microsoft.ContainerRegistry \
            Microsoft.OperationalInsights \
            Microsoft.ManagedIdentity \
            Microsoft.Resources \
            Microsoft.Authorization; do
            state=$(az provider show --namespace "$ns" --query registrationState -o tsv 2>/dev/null || echo "NotRegistered")
            echo "$ns: $state"
            if [ "$state" != "Registered" ]; then
              az provider register --namespace "$ns" --wait
            fi
          done

      - name: Ensure resource group
        run: |
          if ! az group show --name "$AZURE_RESOURCE_GROUP" >/dev/null 2>&1; then
            az group create --name "$AZURE_RESOURCE_GROUP" --location "$AZURE_LOCATION" \
              --tags product=gcc environment=production
          fi

      - name: Deploy infrastructure (Bicep)
        id: infra
        run: |
          set -euo pipefail
          DEPLOY_NAME="gcc-infra-${{ github.run_id }}"
          az deployment group create \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$DEPLOY_NAME" \
            --template-file infra/azure/main.bicep \
            --parameters "@infra/azure/main.parameters.json" \
            --parameters location="$AZURE_LOCATION" \
            --output json > /tmp/gcc-infra-out.json

          ACR_NAME=$(jq -r '.properties.outputs.acrName.value' /tmp/gcc-infra-out.json)
          APP_NAME=$(jq -r '.properties.outputs.containerAppName.value' /tmp/gcc-infra-out.json)
          FQDN=$(jq -r '.properties.outputs.containerAppFqdn.value' /tmp/gcc-infra-out.json)
          AZURE_URL=$(jq -r '.properties.outputs.containerAppUrl.value' /tmp/gcc-infra-out.json)

          echo "acr_name=${ACR_NAME}" >> "$GITHUB_OUTPUT"
          echo "app_name=${APP_NAME}" >> "$GITHUB_OUTPUT"
          echo "fqdn=${FQDN}" >> "$GITHUB_OUTPUT"
          echo "azure_url=${AZURE_URL}" >> "$GITHUB_OUTPUT"

          echo "Infrastructure deployed:"
          echo "  ACR: ${ACR_NAME}"
          echo "  Container App: ${APP_NAME}"
          echo "  FQDN: ${FQDN}"

      - name: Login to ACR
        run: az acr login --name ${{ steps.infra.outputs.acr_name }}

      - name: Build and push Docker image
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          TAG="${{ github.sha }}"
          IMAGE="${{ steps.infra.outputs.acr_name }}.azurecr.io/${{ env.IMAGE_NAME }}:${TAG}"

          if [ -z "${NEXT_PUBLIC_SUPABASE_URL:-}" ] || [ -z "${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}" ]; then
            echo "Missing required GitHub secret for Docker build: NEXT_PUBLIC_SUPABASE_URL and/or NEXT_PUBLIC_SUPABASE_ANON_KEY" >&2
            exit 1
          fi

          # Normalize Project URL for build-time inlining (never echo secret values).
          NEXT_PUBLIC_SUPABASE_URL="${NEXT_PUBLIC_SUPABASE_URL%"${NEXT_PUBLIC_SUPABASE_URL##*[![:space:]]}"}"
          NEXT_PUBLIC_SUPABASE_URL="${NEXT_PUBLIC_SUPABASE_URL#"${NEXT_PUBLIC_SUPABASE_URL%%[![:space:]]*}"}"
          NEXT_PUBLIC_SUPABASE_URL="${NEXT_PUBLIC_SUPABASE_URL%/}"
          NEXT_PUBLIC_SUPABASE_URL="${NEXT_PUBLIC_SUPABASE_URL%/rest/v1}"
          NEXT_PUBLIC_SUPABASE_URL="${NEXT_PUBLIC_SUPABASE_URL%/auth/v1}"
          NEXT_PUBLIC_SUPABASE_URL="${NEXT_PUBLIC_SUPABASE_URL%/}"
          host="$(echo "$NEXT_PUBLIC_SUPABASE_URL" | sed -E 's|https?://([^/]+).*|\1|')"
          echo "Docker build-arg Supabase host: $host"

          # NEXT_PUBLIC_* must be build-args so Next.js inlines them into the browser bundle.
          # SUPABASE_SERVICE_ROLE_KEY must NEVER be passed as a build-arg.
          docker build \
            --build-arg "NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}" \
            --build-arg "NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}" \
            --build-arg "NEXT_PUBLIC_APP_URL=https://app.growthcommandcenter.com" \
            --build-arg "NEXT_PUBLIC_MARKETING_URL=https://growthcommandcenter.com" \
            -t "$IMAGE" \
            -t "${{ steps.infra.outputs.acr_name }}.azurecr.io/${{ env.IMAGE_NAME }}:latest" \
            .
          docker push "$IMAGE"
          docker push "${{ steps.infra.outputs.acr_name }}.azurecr.io/${{ env.IMAGE_NAME }}:latest"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "DOCKER_BUILD_ENV_INJECTION=PASS"

      - name: Configure Container App secrets and env
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_STARTER_PRICE_ID: ${{ secrets.STRIPE_STARTER_PRICE_ID }}
          STRIPE_GROWTH_PRICE_ID: ${{ secrets.STRIPE_GROWTH_PRICE_ID }}
          STRIPE_ENTERPRISE_PRICE_ID: ${{ secrets.STRIPE_ENTERPRISE_PRICE_ID }}
          QUICKBOOKS_CLIENT_ID: ${{ secrets.QUICKBOOKS_CLIENT_ID }}
          QUICKBOOKS_CLIENT_SECRET: ${{ secrets.QUICKBOOKS_CLIENT_SECRET }}
          QUICKBOOKS_REDIRECT_URI: ${{ secrets.QUICKBOOKS_REDIRECT_URI }}
          QUICKBOOKS_ENV: ${{ secrets.QUICKBOOKS_ENV }}
          PLAID_CLIENT_ID: ${{ secrets.PLAID_CLIENT_ID }}
          PLAID_SECRET: ${{ secrets.PLAID_SECRET }}
          PLAID_ENV: ${{ secrets.PLAID_ENV }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REDIRECT_URI: ${{ secrets.GOOGLE_REDIRECT_URI }}
        run: |
          set -euo pipefail
          APP="${{ steps.infra.outputs.app_name }}"
          RG="$AZURE_RESOURCE_GROUP"

          required=(NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY SUPABASE_SERVICE_ROLE_KEY)
          for key in "${required[@]}"; do
            if [ -z "${!key:-}" ]; then
              echo "Missing required GitHub secret: $key" >&2
              exit 1
            fi
          done

          # Normalize Project URL (strip /rest/v1|/auth/v1|trailing slash). Never echo secret values.
          NEXT_PUBLIC_SUPABASE_URL="${NEXT_PUBLIC_SUPABASE_URL%"${NEXT_PUBLIC_SUPABASE_URL##*[![:space:]]}"}"
          NEXT_PUBLIC_SUPABASE_URL="${NEXT_PUBLIC_SUPABASE_URL#"${NEXT_PUBLIC_SUPABASE_URL%%[![:space:]]*}"}"
          NEXT_PUBLIC_SUPABASE_URL="${NEXT_PUBLIC_SUPABASE_URL%/}"
          NEXT_PUBLIC_SUPABASE_URL="${NEXT_PUBLIC_SUPABASE_URL%/rest/v1}"
          NEXT_PUBLIC_SUPABASE_URL="${NEXT_PUBLIC_SUPABASE_URL%/auth/v1}"
          NEXT_PUBLIC_SUPABASE_URL="${NEXT_PUBLIC_SUPABASE_URL%/}"
          host="$(echo "$NEXT_PUBLIC_SUPABASE_URL" | sed -E 's|https?://([^/]+).*|\1|')"
          echo "Supabase URL host: $host"
          if [[ ! "$host" =~ \.supabase\.(co|in)$ ]] && [[ "$host" != "localhost" ]] && [[ "$host" != "127.0.0.1" ]]; then
            echo "BLOCKER: NEXT_PUBLIC_SUPABASE_URL must be https://<ref>.supabase.co (got host=$host)" >&2
            exit 1
          fi
          if [[ "$NEXT_PUBLIC_SUPABASE_URL" =~ /rest/v1|/auth/v1 ]]; then
            echo "BLOCKER: NEXT_PUBLIC_SUPABASE_URL still contains API path after normalize" >&2
            exit 1
          fi

          # Trim accidental whitespace / Bearer prefix on service role (never print value)
          SUPABASE_SERVICE_ROLE_KEY="${SUPABASE_SERVICE_ROLE_KEY#"${SUPABASE_SERVICE_ROLE_KEY%%[![:space:]]*}"}"
          SUPABASE_SERVICE_ROLE_KEY="${SUPABASE_SERVICE_ROLE_KEY%"${SUPABASE_SERVICE_ROLE_KEY##*[![:space:]]}"}"
          SUPABASE_SERVICE_ROLE_KEY="${SUPABASE_SERVICE_ROLE_KEY#Bearer }"

          secret_args=()
          env_args=(
            "NODE_ENV=production"
            "PORT=3000"
            "HOSTNAME=0.0.0.0"
            "NEXT_PUBLIC_APP_URL=https://app.growthcommandcenter.com"
            "NEXT_PUBLIC_MARKETING_URL=https://growthcommandcenter.com"
            "NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}"
            "NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}"
          )

          add_secret() {
            local env_name="$1"
            local value="$2"
            [ -z "$value" ] && return 0
            # Azure Container Apps secret names must be lowercase alphanumeric + '-'
            local secret_name
            secret_name=$(echo "$env_name" | tr '[:upper:]' '[:lower:]' | tr '_' '-')
            secret_args+=("${secret_name}=${value}")
            env_args+=("${env_name}=secretref:${secret_name}")
          }

          add_secret SUPABASE_SERVICE_ROLE_KEY "$SUPABASE_SERVICE_ROLE_KEY"
          add_secret ANTHROPIC_API_KEY "$ANTHROPIC_API_KEY"
          add_secret STRIPE_SECRET_KEY "$STRIPE_SECRET_KEY"
          add_secret STRIPE_WEBHOOK_SECRET "$STRIPE_WEBHOOK_SECRET"
          add_secret STRIPE_STARTER_PRICE_ID "$STRIPE_STARTER_PRICE_ID"
          add_secret STRIPE_GROWTH_PRICE_ID "$STRIPE_GROWTH_PRICE_ID"
          add_secret STRIPE_ENTERPRISE_PRICE_ID "$STRIPE_ENTERPRISE_PRICE_ID"
          add_secret QUICKBOOKS_CLIENT_ID "$QUICKBOOKS_CLIENT_ID"
          add_secret QUICKBOOKS_CLIENT_SECRET "$QUICKBOOKS_CLIENT_SECRET"
          add_secret QUICKBOOKS_REDIRECT_URI "$QUICKBOOKS_REDIRECT_URI"
          add_secret QUICKBOOKS_ENV "$QUICKBOOKS_ENV"
          add_secret PLAID_CLIENT_ID "$PLAID_CLIENT_ID"
          add_secret PLAID_SECRET "$PLAID_SECRET"
          add_secret PLAID_ENV "$PLAID_ENV"
          add_secret GOOGLE_CLIENT_ID "$GOOGLE_CLIENT_ID"
          add_secret GOOGLE_CLIENT_SECRET "$GOOGLE_CLIENT_SECRET"
          add_secret GOOGLE_REDIRECT_URI "$GOOGLE_REDIRECT_URI"

          if [ "${#secret_args[@]}" -gt 0 ]; then
            az containerapp secret set \
              --name "$APP" \
              --resource-group "$RG" \
              --secrets "${secret_args[@]}"
          fi

          az containerapp update \
            --name "$APP" \
            --resource-group "$RG" \
            --image "$IMAGE" \
            --set-env-vars "${env_args[@]}"

      - name: Wait for healthy revision
        run: |
          set -euo pipefail
          APP="${{ steps.infra.outputs.app_name }}"
          FQDN="${{ steps.infra.outputs.fqdn }}"
          for i in $(seq 1 30); do
            if curl -fsS "https://${FQDN}/api/health" >/dev/null 2>&1; then
              curl -fsS "https://${FQDN}/api/health"
              exit 0
            fi
            echo "Waiting for healthy revision (${i}/30)..."
            sleep 20
          done
          echo "Container App did not become healthy in time" >&2
          az containerapp revision list --name "$APP" --resource-group "$AZURE_RESOURCE_GROUP" -o table
          exit 1

      - name: Report deployment outputs
        run: |
          APP="${{ steps.infra.outputs.app_name }}"
          REV=$(az containerapp revision list \
            --name "$APP" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query "[?properties.active].name | [0]" -o tsv)
          echo "AZURE_CONTAINER_APP_NAME=${APP}"
          echo "AZURE_CONTAINER_APP_REVISION=${REV}"
          echo "AZURE_PUBLIC_URL=https://${{ steps.infra.outputs.fqdn }}"

  pre-cutover-uat:
    needs: deploy
    runs-on: ubuntu-latest
    if: github.repository == 'mblv89117/growth-command-center'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Unit tests
        run: npm run test

      - name: Diagnose Supabase URL/key kinds (no secret values)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node --input-type=module <<'EOF'
          import {
            normalizeSupabaseUrl,
            describeSupabaseUrl,
            describeKeyKind,
          } from "./scripts/lib/normalize-supabase-url.mjs";
          const raw = process.env.NEXT_PUBLIC_SUPABASE_URL ?? "";
          console.log("URL_DIAG", JSON.stringify(describeSupabaseUrl(raw)));
          console.log("ANON_KEY_KIND", describeKeyKind(process.env.NEXT_PUBLIC_SUPABASE_ANON_KEY));
          console.log("SERVICE_KEY_KIND", describeKeyKind(process.env.SUPABASE_SERVICE_ROLE_KEY));
          console.log("URL_NORMALIZED_HOST", new URL(normalizeSupabaseUrl(raw)).host);
          EOF

      - name: Azure pre-cutover go-live UAT
        env:
          SMOKE_BASE_URL: https://${{ needs.deploy.outputs.fqdn }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run uat:golive

      - name: Domain routing unit checks
        run: npm run test:domain-routing

      - name: Azure FQDN surface smoke (pre-custom-domain)
        env:
          AZURE_FQDN: ${{ needs.deploy.outputs.fqdn }}
        run: |
          set -euo pipefail
          # Azure Container Apps cannot honor arbitrary Host / X-Forwarded-Host before
          # custom domains are bound (platform 404 / header overwrite). Certify the FQDN
          # surface here; Host-header routing is re-checked after domain binding.
          root=$(curl -sI "https://${AZURE_FQDN}/" | head -1)
          privacy=$(curl -sI "https://${AZURE_FQDN}/privacy" | head -1)
          terms=$(curl -sI "https://${AZURE_FQDN}/terms" | head -1)
          login=$(curl -sI "https://${AZURE_FQDN}/login" | head -1)
          health=$(curl -fsS "https://${AZURE_FQDN}/api/health")
          echo "root: $root"
          echo "privacy: $privacy"
          echo "terms: $terms"
          echo "login: $login"
          echo "health: $health"
          echo "$root" | grep -q "200"
          echo "$privacy" | grep -q "200"
          echo "$terms" | grep -q "200"
          echo "$login" | grep -Eq "200|30[1278]"
          echo "$health" | grep -q '"status":"ok"'
          echo "HOST_HEADER_ROUTING=DEFERRED_UNTIL_CUSTOM_DOMAIN_BINDING"

      - name: Production login auth + branding smoke
        env:
          APP_URL: https://app.growthcommandcenter.com
          AZURE_FQDN: ${{ needs.deploy.outputs.fqdn }}
        run: |
          set -euo pipefail
          # Prefer ACA FQDN (guaranteed new revision), then custom domain.
          for base in "https://${AZURE_FQDN}" "$APP_URL"; do
            echo "Checking $base/login"
            html=$(curl -fsS "$base/login")
            echo "$html" | grep -qi "Growth Command Center"
            if echo "$html" | grep -qi "credentials are not configured"; then
              echo "FAIL: production login still shows missing-credentials message at $base" >&2
              exit 1
            fi
            if echo "$html" | grep -qi "demo mode to explore"; then
              echo "FAIL: production login still advertises demo fallback at $base" >&2
              exit 1
            fi
            echo "$html" | grep -E -q '/brand/gcc-logo|/favicon\\.ico'
            chunk=$(echo "$html" | grep -oE '/_next/static/chunks/[^"]*login[^"]*\\.js' | head -1 || true)
            if [ -z "$chunk" ]; then
              chunk=$(echo "$html" | grep -oE '/_next/static/chunks/app/\\(auth\\)/login/[^"]+\\.js' | head -1 || true)
            fi
            if [ -n "$chunk" ]; then
              js=$(curl -fsS "${base}${chunk}")
              if echo "$js" | grep -q 'env\\.NEXT_PUBLIC_SUPABASE_URL'; then
                echo "FAIL: login chunk still references env.NEXT_PUBLIC_SUPABASE_URL (build-time inline missing)" >&2
                exit 1
              fi
              if ! echo "$js" | grep -q 'supabase\\.co'; then
                echo "FAIL: login chunk missing inlined supabase.co host" >&2
                exit 1
              fi
              echo "NEXT_PUBLIC_BUILD_INLINE=PASS chunk=$chunk"
            else
              echo "WARN: login chunk path not found in HTML; HTML checks passed"
            fi
            echo "AZURE_APP_AUTH_CONFIG=PASS base=$base"
          done

      - name: QuickBooks route smoke
        env:
          AZURE_FQDN: ${{ needs.deploy.outputs.fqdn }}
        run: |
          set -euo pipefail
          cb=$(curl -sI "https://${AZURE_FQDN}/api/integrations/quickbooks/callback" | head -1)
          echo "callback: $cb"
          echo "$cb" | grep -Eq "30[27]"


  bind-custom-domains:
    needs: pre-cutover-uat
    runs-on: ubuntu-latest
    if: github.repository == 'mblv89117/growth-command-center'
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Bind custom domains + emit exact DNS records
        env:
          AZURE_RESOURCE_GROUP: ${{ env.AZURE_RESOURCE_GROUP }}
          CONTAINER_APP_NAME: azapprngzn
          CONTAINER_APPS_ENV: azcaerngzn
        run: |
          set -euo pipefail
          chmod +x scripts/azure/bind-custom-domains.sh
          scripts/azure/bind-custom-domains.sh | tee /tmp/gcc-dns-records.txt

      - name: Upload DNS record artifact
        uses: actions/upload-artifact@v4
        with:
          name: gcc-azure-dns-records
          path: /tmp/gcc-dns-records.txt
          retention-days: 30

      - name: Job summary
        run: |
          {
            echo "## Azure custom domain bind"
            echo ""
            echo "Apply **only** the DNS records below in GoDaddy."
            echo "Do not cut traffic until Azure hostname status is Provisioned."
            echo "Keep Vercel for rollback."
            echo ""
            echo '```'
            cat /tmp/gcc-dns-records.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
